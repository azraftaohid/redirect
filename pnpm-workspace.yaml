  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261025.1'
  - hono@4.13.18
  - undici@7.30.2
  - zod@4.6.7

overrides:
  hono: "^4.13.18"
  "undici@<8": ">=7.30.1 <8"
  "zod@<4.6.7": "^4.6.7"

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
