<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <title>404 Not Found — Redirect</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%20fill%3D%22none%22%3E%3Cstyle%3E.bg%7Bfill%3A%2318181b%7D.fg%7Bstroke%3A%23fafafa%7D%40media(prefers-color-scheme%3Adark)%7B.bg%7Bfill%3A%23f4f4f5%7D.fg%7Bstroke%3A%2309090b%7D%7D%3C%2Fstyle%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2224%22%20class%3D%22bg%22%2F%3E%3Cpath%20d%3D%22M43.5%2024L26.5%2076%22%20class%3D%22fg%22%20stroke-width%3D%228.7%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M55.5%2034L74.5%2050L55.5%2066%22%20class%3D%22fg%22%20stroke-width%3D%228.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --card-bg: #ffffff;
        --surface: #f4f4f5;
        --surface-border: #e4e4e7;
        --text: #18181b;
        --text-heading: #09090b;
        --text-muted: #71717a;
        --border: #e4e4e7;
        --icon-fg: #52525b;
        --logo-bg: #18181b;
        --logo-fg: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --card-bg: #18181b;
          --surface: #27272a;
          --surface-border: rgba(63, 63, 70, 0.8);
          --text: #f4f4f5;
          --text-heading: #fafafa;
          --text-muted: #a1a1aa;
          --border: #27272a;
          --icon-fg: #a1a1aa;
          --logo-bg: #f4f4f5;
          --logo-fg: #09090b;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .container {
        width: 100%;
        max-width: 26rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }
      .card {
        width: 100%;
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 2rem 1.75rem;
        text-align: center;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .icon-box {
        width: 3rem;
        height: 3rem;
        border-radius: 0.75rem;
        background-color: var(--surface);
        border: 1px solid var(--surface-border);
        color: var(--icon-fg);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border);
        background-color: var(--surface);
        color: var(--icon-fg);
        border-radius: 0.375rem;
        padding: 0.125rem 0.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1rem;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.75rem;
        color: var(--text-heading);
        margin-bottom: 0.5rem;
      }
      p {
        color: var(--text-muted);
        font-size: 0.875rem;
        line-height: 1.625;
        max-width: 20rem;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        color: var(--text-muted);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      .brand-link {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        color: inherit;
        text-decoration: none;
        padding: 0.25rem 0.5rem;
        border-radius: 0.5rem;
        transition: color 0.15s ease;
      }
      .brand-link:hover {
        color: var(--text-heading);
      }
      .brand-link:focus-visible {
        outline: 2px solid var(--text-heading);
        outline-offset: 2px;
      }
      .brand .logo {
        width: 1.25rem;
        height: 1.25rem;
        flex-shrink: 0;
      }
      .brand .logo-bg {
        fill: var(--logo-bg);
      }
      .brand .logo-fg {
        stroke: var(--logo-fg);
      }
      .brand-sep {
        font-weight: 400;
        opacity: 0.6;
      }
      .brand-repo {
        font-weight: 500;
      }
      .brand .ext-icon {
        width: 0.875rem;
        height: 0.875rem;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="card">
        <div class="icon-box" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71" />
            <path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71" />
            <line x1="8" x2="8" y1="2" y2="5" />
            <line x1="2" x2="5" y1="8" y2="8" />
            <line x1="16" x2="16" y1="19" y2="22" />
            <line x1="19" x2="22" y1="16" y2="16" />
          </svg>
        </div>
        <div class="badge">404 Not Found</div>
        <h1>Link Not Found</h1>
        <p>The requested short link does not exist, has expired, or has been disabled.</p>
      </div>
      <div class="brand">
        <a
          class="brand-link"
          href="https://github.com/azraftaohid/redirect"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-hidden="true">
            <rect width="100" height="100" rx="24" class="logo-bg" />
            <path d="M43.5 24L26.5 76" class="logo-fg" stroke-width="8.7" stroke-linecap="round" />
            <path
              d="M55.5 34L74.5 50L55.5 66"
              class="logo-fg"
              stroke-width="8.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Redirect</span>
          <span class="brand-sep" aria-hidden="true">&middot;</span>
          <span class="brand-repo">GitHub</span>
          <svg
            class="ext-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 3h6v6" />
            <path d="M10 14 21 3" />
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          </svg>
        </a>
      </div>
    </main>
  </body>
</html>
